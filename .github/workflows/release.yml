name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Verify generated Xray configuration
        run: |
          curl -fsSL https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip -o /tmp/xray.zip
          echo '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray.zip' | sha256sum -c -
          unzip -p /tmp/xray.zip xray > /tmp/xray
          chmod +x /tmp/xray
          BOARDRAY_TEST_XRAY=/tmp/xray go test ./...
          go vet ./...
          bash -n scripts/*.sh
      - name: Build release assets
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o boardray-linux-amd64 ./cmd/boardray
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o boardray-linux-arm64 ./cmd/boardray
          sha256sum boardray-linux-amd64 boardray-linux-arm64 > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            boardray-linux-amd64
            boardray-linux-arm64
            SHA256SUMS
